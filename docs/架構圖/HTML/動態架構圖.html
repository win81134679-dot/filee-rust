<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filee Rust 動態架構圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #f4f7fb;
      --color-ink: #14213d;
      --color-muted: #44506b;
      --color-soft: #56627c;
      --color-accent: #fb8c00;
      --color-rule: rgba(20,33,61,0.12);
      --font-sans: 'Geist', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 1100ms;
      --motion-total: 6600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    main { display: grid; gap: 72px; justify-items: center; }
    [data-motion-root] { width: min(100%, 1320px); max-width: 100%; min-width: 0; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 36px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 1280px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .t-name { font: 600 16px var(--font-sans); }
    .t-sub  { font: 400 12px var(--font-sans); }
    .t-mono { font: 400 12px var(--font-mono); }
    .t-tag  { font: 500 8px var(--font-mono); letter-spacing: 0.08em; }
    .t-lbl  { font: 500 12px var(--font-sans); }
    .t-zone { font: 500 13px var(--font-sans); }
    .t-callout { font: italic 400 16px var(--font-serif); }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 13px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    .keyboard-help { color: var(--color-soft); font: 500 12px/1.4 var(--font-sans); }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<main>

  <!-- ===================== 1. 執行架構 ===================== -->
  <section data-motion-root data-motion-mode="step" data-step-count="6" data-step-current="6" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">架構圖 · 一次轉檔怎麼跑</p>
    <h1>常駐的只有等待與選擇，轉檔與視窗用完就結束</h1>

    <div class="diagram-container">
      <svg viewBox="0 140 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lite-motion-arch-title lite-motion-arch-desc">
        <title id="lite-motion-arch-title">Filee Rust 執行架構</title>
        <desc id="lite-motion-arch-desc">常駐的 filee-rust.exe 接住 Ctrl 拖曳、顯示環形選單；一般轉檔交給轉完就結束的上游 filee-cli，設定與互動工具臨時開上游 Filee.exe 的 hosted 模式，三者共用 %APPDATA%\Filee 的設定檔與同一組轉換引擎。</desc>
        <defs>
          <marker id="lite-motion-arch-in" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2196f3"/></marker>
          <marker id="lite-motion-arch-proc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3949ab"/></marker>
          <marker id="lite-motion-arch-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e27e00"/></marker>
          <marker id="lite-motion-arch-ui" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8e24aa"/></marker>
          <marker id="lite-motion-arch-temp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf9222"/></marker>
          <marker id="lite-motion-arch-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#44506b"/></marker>
        </defs>
        <rect x="0" y="0" width="1280" height="904" fill="#f4f7fb"/>

        <!-- 區塊（一直在） -->
        <rect x="296" y="160" width="536" height="384" rx="8" fill="#14213d" fill-opacity="0.02" stroke="#14213d" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="312" y="184" class="t-zone" fill="#56627c">filee-rust.exe · 一直開著（Rust）</text>
        <text x="816" y="184" class="t-mono" fill="#56627c" text-anchor="end">閒置目標 &lt; 30 MB（待實測）</text>
        <rect x="872" y="160" width="360" height="384" rx="8" fill="#14213d" fill-opacity="0.02" stroke="#14213d" stroke-opacity="0.10" stroke-width="0.8" stroke-dasharray="5,4"/>
        <text x="888" y="184" class="t-zone" fill="#56627c">上游 Filee · 要用才開，做完自己結束</text>

        <!-- 連線層（在節點之前） -->
        <g data-motion-item data-step="2" aria-label="步驟 2 連線：手勢送到 hook，hook 叫出環形選單">
          <line x1="264" y1="260" x2="318" y2="260" stroke="#2196f3" stroke-width="1.2" marker-end="url(#lite-motion-arch-in)"/>
          <line x1="544" y1="260" x2="582" y2="260" stroke="#3949ab" stroke-width="1.2" marker-end="url(#lite-motion-arch-proc)"/>
        </g>
        <g data-motion-item data-step="3" aria-label="步驟 3 連線：選一般轉檔交給 filee-cli，再用引擎轉">
          <line x1="808" y1="244" x2="894" y2="244" stroke="#e27e00" stroke-width="1.6" marker-end="url(#lite-motion-arch-accent)"/>
          <path d="M 1216,244 H 1244 Q 1252,244 1252,252 V 696 Q 1252,704 1244,704 H 1218" fill="none" stroke="#3949ab" stroke-width="1.2" marker-end="url(#lite-motion-arch-proc)"/>
          <rect x="822" y="216" width="64" height="16" rx="2" fill="#f4f7fb"/>
          <text x="854" y="228" class="t-lbl" fill="#a65c00" text-anchor="middle">一般轉檔</text>
        </g>
        <g data-motion-item data-step="5" aria-label="步驟 5 連線：工具與設定才開上游視窗，它也用同一組引擎">
          <path d="M 808,284 H 844 Q 852,284 852,292 V 432 Q 852,440 860,440 H 894" fill="none" stroke="#e27e00" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lite-motion-arch-accent)"/>
          <line x1="808" y1="468" x2="894" y2="468" stroke="#8e24aa" stroke-width="1.2" marker-end="url(#lite-motion-arch-ui)"/>
          <line x1="1056" y1="496" x2="1056" y2="662" stroke="#bf9222" stroke-width="1.2" marker-end="url(#lite-motion-arch-temp)"/>
          <rect x="760" y="348" width="84" height="16" rx="2" fill="#f4f7fb"/>
          <text x="802" y="360" class="t-lbl" fill="#a65c00" text-anchor="middle">工具・合併</text>
          <rect x="818" y="476" width="68" height="16" rx="2" fill="#f4f7fb"/>
          <text x="852" y="488" class="t-lbl" fill="#8e24aa" text-anchor="middle">開設定</text>
          <rect x="1066" y="576" width="52" height="16" rx="2" fill="#f4f7fb"/>
          <text x="1092" y="588" class="t-lbl" fill="#8d6c19" text-anchor="middle">同一組</text>
        </g>
        <g data-motion-item data-step="6" aria-label="步驟 6 連線：外殼與上游視窗讀寫同一份設定">
          <line x1="564" y1="544" x2="564" y2="662" stroke="#44506b" stroke-width="1.2" marker-end="url(#lite-motion-arch-muted)"/>
          <path d="M 896,484 H 872 Q 864,484 864,492 V 696 Q 864,704 856,704 H 834" fill="none" stroke="#bf9222" stroke-width="1.2" marker-end="url(#lite-motion-arch-temp)"/>
          <rect x="576" y="596" width="108" height="16" rx="2" fill="#f4f7fb"/>
          <text x="630" y="608" class="t-lbl" fill="#44506b" text-anchor="middle">讀設定・寫紀錄</text>
          <rect x="874" y="592" width="56" height="16" rx="2" fill="#f4f7fb"/>
          <text x="902" y="604" class="t-lbl" fill="#8d6c19" text-anchor="middle">改設定</text>
        </g>

        <!-- 節點層 -->
        <g data-motion-item data-step="1" aria-label="步驟 1：在檔案總管按住 Ctrl 拖檔案（或 Ctrl+Alt+Space、右鍵）">
          <rect x="64" y="216" width="200" height="120" rx="6" fill="#c1e0f9" stroke="#2196f3" stroke-width="1.2"/>
          <rect x="72" y="222" width="32" height="12" rx="2" fill="none" stroke="#2196f3" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="88" y="231" class="t-tag" fill="#1663a0" text-anchor="middle">USER</text>
          <text x="164" y="258" class="t-name" fill="#14213d" text-anchor="middle">檔案總管裡的你</text>
          <text x="164" y="280" class="t-sub" fill="#44506b" text-anchor="middle">按住 Ctrl 拖檔案</text>
          <text x="164" y="300" class="t-mono" fill="#44506b" text-anchor="middle">Ctrl+Alt+Space</text>
          <text x="164" y="320" class="t-sub" fill="#44506b" text-anchor="middle">右鍵「用 Filee 轉換」</text>
        </g>
        <g data-motion-item data-step="2" aria-label="步驟 2：全域 hook 只聽不攔，確認是檔案總管後叫出環形選單">
          <rect x="320" y="216" width="224" height="88" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
          <rect x="328" y="222" width="32" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="344" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">HOOK</text>
          <text x="432" y="254" class="t-name" fill="#14213d" text-anchor="middle">全域輸入與手勢</text>
          <text x="432" y="274" class="t-mono" fill="#44506b" text-anchor="middle">WH_MOUSE_LL · WH_KEYBOARD_LL</text>
          <text x="432" y="292" class="t-sub" fill="#44506b" text-anchor="middle">只聽不攔・判斷是不是檔案總管</text>
          <rect x="584" y="216" width="224" height="88" rx="6" fill="#f6ddbf" stroke="#fb8c00" stroke-width="1.2"/>
          <rect x="592" y="222" width="36" height="12" rx="2" fill="none" stroke="#fb8c00" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="610" y="231" class="t-tag" fill="#925100" text-anchor="middle">DONUT</text>
          <text x="696" y="254" class="t-name" fill="#14213d" text-anchor="middle">環形選單</text>
          <text x="696" y="274" class="t-mono" fill="#44506b" text-anchor="middle">Direct2D · OLE 拖放</text>
          <text x="696" y="292" class="t-sub" fill="#44506b" text-anchor="middle">依檔案類型選面・正反面・群組</text>
        </g>
        <g data-motion-item data-step="3" aria-label="步驟 3：放在一般轉檔上，filee-cli 用引擎轉完就結束">
          <rect x="896" y="216" width="320" height="88" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
          <rect x="904" y="222" width="24" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="916" y="231" class="t-tag" fill="#3949ab" text-anchor="middle">CLI</text>
          <text x="1056" y="254" class="t-name" fill="#14213d" text-anchor="middle">filee-cli.exe</text>
          <text x="1056" y="274" class="t-mono" fill="#44506b" text-anchor="middle">convert --preset &lt;id&gt;</text>
          <text x="1056" y="292" class="t-sub" fill="#44506b" text-anchor="middle">每次一個・轉完就結束（實測 0.5 秒、89 MB）</text>
          <rect x="896" y="664" width="320" height="80" rx="6" fill="#d6dee4" stroke="#78909c" stroke-width="1.2"/>
          <rect x="904" y="670" width="24" height="12" rx="2" fill="none" stroke="#78909c" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="916" y="679" class="t-tag" fill="#4f5f67" text-anchor="middle">EXT</text>
          <text x="1056" y="700" class="t-name" fill="#14213d" text-anchor="middle">轉換引擎（每週自動更新）</text>
          <text x="1056" y="722" class="t-sub" fill="#44506b" text-anchor="middle">MS Office 優先 → LibreOffice・7-Zip・OCR…</text>
        </g>
        <g data-motion-item data-step="4" aria-label="步驟 4：右下角通知顯示完成檔數，可開啟檔案或資料夾">
          <rect x="584" y="408" width="224" height="88" rx="6" fill="#dcc4e8" stroke="#8e24aa" stroke-width="1.2"/>
          <rect x="592" y="414" width="20" height="12" rx="2" fill="none" stroke="#8e24aa" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="602" y="423" class="t-tag" fill="#8b23a7" text-anchor="middle">UI</text>
          <text x="696" y="446" class="t-name" fill="#14213d" text-anchor="middle">進度通知與系統匣</text>
          <text x="696" y="466" class="t-sub" fill="#44506b" text-anchor="middle">完成檔數・開啟・開資料夾</text>
          <text x="696" y="484" class="t-sub" fill="#44506b" text-anchor="middle">暫停／恢復・結束</text>
        </g>
        <g data-motion-item data-step="5" aria-label="步驟 5：裁切、剪輯、合併或設定，才臨時開上游 Filee 視窗，關掉就結束">
          <rect x="896" y="408" width="320" height="88" rx="6" fill="#f6eaca" stroke="#d8a527" stroke-width="1.2"/>
          <rect x="904" y="414" width="28" height="12" rx="2" fill="none" stroke="#d8a527" stroke-opacity="0.8" stroke-width="0.8"/>
          <text x="918" y="423" class="t-tag" fill="#836417" text-anchor="middle">GUI</text>
          <text x="1056" y="446" class="t-name" fill="#14213d" text-anchor="middle">Filee.exe --hosted</text>
          <text x="1056" y="466" class="t-mono" fill="#44506b" text-anchor="middle">--settings · --run=&lt;工具&gt;</text>
          <text x="1056" y="484" class="t-sub" fill="#44506b" text-anchor="middle">裁切・剪輯・頁面編輯・列印工作室</text>
        </g>
        <g data-motion-item data-step="6" aria-label="步驟 6：自動轉換資料夾與所有程式共用同一份設定與紀錄">
          <rect x="320" y="408" width="224" height="88" rx="6" fill="#c7cde8" stroke="#3949ab" stroke-width="1.2"/>
          <rect x="328" y="414" width="36" height="12" rx="2" fill="none" stroke="#3949ab" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="346" y="423" class="t-tag" fill="#3949ab" text-anchor="middle">WATCH</text>
          <text x="432" y="446" class="t-name" fill="#14213d" text-anchor="middle">自動轉換資料夾</text>
          <text x="432" y="466" class="t-sub" fill="#44506b" text-anchor="middle">檔案穩定 2 秒才轉</text>
          <text x="432" y="484" class="t-sub" fill="#44506b" text-anchor="middle">300 DPI 政策・右鍵選單</text>
          <rect x="320" y="664" width="512" height="80" rx="6" fill="#b9dddc" stroke="#00897b" stroke-width="1.2"/>
          <rect x="328" y="670" width="28" height="12" rx="2" fill="none" stroke="#00897b" stroke-opacity="0.6" stroke-width="0.8"/>
          <text x="342" y="679" class="t-tag" fill="#00685d" text-anchor="middle">JSON</text>
          <text x="576" y="700" class="t-name" fill="#14213d" text-anchor="middle">共用的設定與紀錄</text>
          <text x="576" y="722" class="t-mono" fill="#44506b" text-anchor="middle">%APPDATA%\Filee\ settings · presets · profiles · history</text>
        </g>

        <!-- 說明與圖例（一直在） -->
        <text x="64" y="420" class="t-callout" fill="#44506b">上游原版一直開著</text>
        <text x="64" y="444" class="t-callout" fill="#44506b">要 ~300 MB；</text>
        <text x="64" y="468" class="t-callout" fill="#44506b">轉換能力一行沒改，</text>
        <text x="64" y="492" class="t-callout" fill="#44506b">上游改版整包替換。</text>
        <line x1="40" y1="796" x2="1240" y2="796" stroke="#44506b" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="40" y="828" class="t-lbl" fill="#44506b">圖例</text>
        <rect x="88" y="818" width="14" height="10" rx="2" fill="#f6ddbf" stroke="#fb8c00" stroke-width="1"/>
        <text x="110" y="828" class="t-sub" fill="#44506b">環形選單（焦點）</text>
        <rect x="222" y="818" width="14" height="10" rx="2" fill="#c1e0f9" stroke="#2196f3" stroke-width="1"/>
        <text x="244" y="828" class="t-sub" fill="#44506b">使用者操作</text>
        <rect x="324" y="818" width="14" height="10" rx="2" fill="#c7cde8" stroke="#3949ab" stroke-width="1"/>
        <text x="346" y="828" class="t-sub" fill="#44506b">處理程式</text>
        <rect x="414" y="818" width="14" height="10" rx="2" fill="#dcc4e8" stroke="#8e24aa" stroke-width="1"/>
        <text x="436" y="828" class="t-sub" fill="#44506b">畫面元件</text>
        <rect x="504" y="818" width="14" height="10" rx="2" fill="#f6eaca" stroke="#d8a527" stroke-width="1"/>
        <text x="526" y="828" class="t-sub" fill="#44506b">臨時開啟的上游視窗</text>
        <rect x="650" y="818" width="14" height="10" rx="2" fill="#b9dddc" stroke="#00897b" stroke-width="1"/>
        <text x="672" y="828" class="t-sub" fill="#44506b">共用資料</text>
        <rect x="740" y="818" width="14" height="10" rx="2" fill="#d6dee4" stroke="#78909c" stroke-width="1"/>
        <text x="762" y="828" class="t-sub" fill="#44506b">外部引擎</text>
        <line x1="836" y1="823" x2="864" y2="823" stroke="#e27e00" stroke-width="1.6" marker-end="url(#lite-motion-arch-accent)"/>
        <text x="872" y="828" class="t-sub" fill="#44506b">選了就跑（線色同起點）</text>
        <line x1="1028" y1="823" x2="1056" y2="823" stroke="#e27e00" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lite-motion-arch-accent)"/>

        <!-- 裝飾：主路徑描線（不帶獨有意義） -->
        <path data-motion-item data-step="3" data-motion-decorative aria-hidden="true" focusable="false" pathLength="1" class="draw-path" d="M808 244 H894"/>

    <div data-motion-controls role="group" aria-label="執行架構圖播放控制">
      <button type="button" data-motion-action="prev">上一步</button>
      <button type="button" data-motion-action="play" aria-pressed="false">播放</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">暫停</button>
      <button type="button" data-motion-action="next">下一步</button>
      <button type="button" data-motion-action="replay">重播</button>
      <span class="keyboard-help">←／→ 上下一步 · 空白鍵 播放／暫停 · R 重播 · Home／End 跳頭尾</span>
      <span data-motion-status-visible aria-hidden="true">第 <span data-motion-step-label>6</span> 步，共 6 步</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>播放控制需要 JavaScript；上面顯示的是完整的圖。</p></noscript>

</main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
